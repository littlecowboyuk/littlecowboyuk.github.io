<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用卡回饋排行</title>
    <!-- 引入極輕量開源套件 List.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
    <style>
        .custom-interactive-wrap {
            max-width: 900px;
            margin: 20px auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
            color: #24292f;
        }

        /* 頂部搜尋列與按鈕整合 */
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-form-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 320px;
        }

        .search-box {
            flex-grow: 1;
            padding: 9px 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: #f6f8fa;
            transition: all 0.2s ease;
            box-sizing: border-box;
            height: 40px;
        }

        .search-box:focus {
            background-color: #ffffff;
            border-color: #8A63D2;
            box-shadow: 0 0 0 3px rgba(138, 99, 210, 0.2);
        }

        /* 專屬深紫色「只搜小牛仔站內」按鈕 */
        .btn-site-search {
            padding: 0 16px;
            height: 40px;
            font-size: 13.5px;
            font-weight: 600;
            color: #ffffff;
            background-color: #4A2A73;
            border: 1px solid #4A2A73;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-site-search:hover {
            background-color: #8A63D2;
            border-color: #8A63D2;
            box-shadow: 0 2px 6px rgba(138, 99, 210, 0.25);
        }

        /* 表格容器外觀 */
        .table-container {
            border: 1px solid #d0d7de;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(27, 31, 36, 0.04);
            overflow-x: auto;
            background-color: #ffffff;
        }

        table.custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        /* 標題欄設定 */
        table.custom-table th {
            background-color: #F9F6FF;
            color: #4A2A73;
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid #d0d7de;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        table.custom-table th:hover {
            background-color: #efe6fa;
        }

        table.custom-table th::after {
            content: " ⇕";
            font-size: 11px;
            color: #8A63D2;
            opacity: 0.7;
        }

        table.custom-table td {
            padding: 14px;
            border-bottom: 1px solid #e1e4e8;
            color: #24292f;
            line-height: 1.6;
            vertical-align: top;
            box-sizing: border-box;
        }

        table.custom-table tr:last-child td {
            border-bottom: none;
        }

        table.custom-table tbody tr:hover {
            background-color: #fdfcff;
        }

        /* 排行徽章 */
        .rank-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .rank-1 { background-color: #feede0; color: #c55a11; }
        .rank-2 { background-color: #fef3c7; color: #b45309; }
        .rank-3 { background-color: #e8f0fe; color: #1a4fd8; }
        .rank-other { background-color: #f0f2f5; color: #57606a; }

        .card-link {
            color: #4A2A73;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .card-link:hover {
            color: #8A63D2;
            text-decoration: underline;
        }

        .rate-bar-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .rate-bar {
            height: 6px;
            background: linear-gradient(90deg, #8A63D2, #4A2A73);
            border-radius: 3px;
        }
        .rate-text {
            font-weight: 700;
            color: #c55a11;
            font-size: 15px;
        }

        .desc-list {
            padding-left: 18px;
            margin: 0;
            font-size: 13.5px;
            color: #333333;
        }
        .desc-list li {
            margin-bottom: 5px;
        }
        .desc-list li:last-child {
            margin-bottom: 0;
        }

        .table-footer {
            padding: 12px 16px;
            background-color: #f6f8fa;
            border-top: 1px solid #d0d7de;
            font-size: 13.5px;
            color: #57606a;
        }
        .table-footer a {
            color: #4A2A73;
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="interactive-card-table" class="custom-interactive-wrap">
    <!-- 頂部搜尋列：表格即時過濾 + Enter/點擊搜小牛仔站內文章 -->
    <div class="table-controls">
        <form class="search-form-wrap" onsubmit="searchLittleCowboy(event)">
            <input type="text" id="siteKeywordInput" class="search search-box" placeholder="🔍 搜尋本表或全站文章（如：富邦、台鐵）..." required />
            <button type="submit" class="btn-site-search">搜小牛仔 ➔</button>
        </form>
        <span style="font-size: 12.5px; color: #57606a;">💡 點擊欄位標題可升降冪排序</span>
    </div>

    <!-- 核心表格結構 -->
    <div class="table-container">
        <table class="custom-table">
            <thead>
                <tr>
                    <th class="sort" data-sort="col-rank" style="width: 14%; text-align: center;">回饋排行</th>
                    <th class="sort" data-sort="col-name" style="width: 28%;">信用卡</th>
                    <th class="sort" data-sort="col-rate" style="width: 18%;">最高回饋</th>
                    <th class="sort" data-sort="col-desc" style="width: 40%;">回饋條件與說明</th>
                </tr>
            </thead>
            <tbody class="list">
                <tr>
                    <td style="text-align: center;">
                        <span class="rank-badge rank-1">TOP 1</span>
                        <span class="col-rank" style="display: none;">1</span>
                    </td>
                    <td>
                        <a href="https://cardpromote.taipeifubon.com.tw/promotion/Detail?sn=C000288" target="_blank" class="card-link col-name">富邦 Costco 聯名卡</a>
                    </td>
                    <td>
                        <div class="rate-bar-wrap">
                            <div class="rate-bar" style="width: 80px;"></div>
                            <span class="rate-text col-rate">8.0%</span>
                        </div>
                    </td>
                    <td class="col-desc">
                        <ul class="desc-list">
                            <li>世界卡最高 8% / 鈦商卡、鈦金卡最高 6%（皆含原權益 1%）。</li>
                            <li>前月「店外」一般消費累積滿 12,000 元（若滿 6,000 元，世界卡 6%、鈦金卡 4%）。</li>
                            <li>需使用台北富邦銀行帳戶自動轉帳扣繳卡費。</li>
                            <li>世界卡加碼上限 550 元（可刷 7,857 元）；鈦金/鈦商卡加碼上限 450 元（可刷 9,000 元）。</li>
                        </ul>
                    </td>
                </tr>

                <tr>
                    <td style="text-align: center;">
                        <span class="rank-badge rank-2">TOP 2</span>
                        <span class="col-rank" style="display: none;">2</span>
                    </td>
                    <td>
