---
title: "關於作者 - 小牛仔"
layout: default
permalink: "/authors-list.html"
---

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h4 class="font-weight-bold spanborder"><span>作者介紹</span></h4>
            
            {% for author in site.authors %}
            <div class="row align-items-center mb-5 p-4 bg-white rounded border shadow-sm">
                <div class="col-md-3 text-center mb-3 mb-md-0">
                    <img class="rounded-circle shadow-sm" src="{{site.baseurl}}{{ author[1].avatar }}" alt="{{ author[1].name }}" width="110" height="110" style="object-fit: cover;">
                </div>
                <div class="col-md-9">
                    <h3 class="font-weight-bold mb-2">{{ author[1].name }}</h3>
                    <p class="text-muted mb-3">{{ author[1].bio }}</p>
                    <div>
                        <a href="mailto:{{ author[1].email }}" class="btn btn-outline-dark btn-sm mr-2">✉️ 寫信聯絡小牛仔</a>
                        <a href="https://www.youtube.com/@%E5%B0%8F%E7%89%9B%E4%BB%94UK-q5j" target="_blank" rel="noopener" class="btn btn-danger btn-sm">▶️ YouTube 頻道</a>
                        <a href="https://s875261.pixnet.net/blog" target="_blank" rel="noopener" class="btn btn-primary btn-sm ml-1">📝 痞客邦部落格</a>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
